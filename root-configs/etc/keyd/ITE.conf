[main]
capslock = overload(control, esc)
rightalt = overload(num, enter)
tab = overload(nav, tab)
leftshift = oneshot(shift)
leftalt = leftmeta
leftmeta = leftalt
leftalt = overload(meta, capslock)

[meta+control]
1 = mute
2 = volumedown
3 = volumeup
4 = micmute
5 = brightnessdown
6 = brightnessup
8 = rfkill

w = scrolldown
e = scrollup
s = scrollleft
d = scrollright
u = playpause
i = previoussong
o = nextsong

[nav]
# physical key that types h/j/k/l in Colemak-DH (keyd sees raw qwerty
# scancodes) Note: Dont' ever put trailing characters after the remap
# it won't work
h = left 
j = down 
k = up
l = right

[num]
a = 1
s = 2
d = 3
f = 4
g = 5
h = 6
j = 7
k = 8
l = 9
; = 0
q = `
u = backspace
i = -
o = =
r = \
w = [
e = ]
t = delete
x = C-S-x
v = C-S-v
