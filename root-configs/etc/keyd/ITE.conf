[main]
capslock = overload(control, esc)
rightalt = overload(num, enter)
insert = capslock
tab = overload(nav, tab)
leftcontrol = leftmouse
leftshift = oneshot(shift)

[nav]
m = left  #h # Since keyd scans the keycodes as qwerty
y = down  #j # I have to remap is acc to it so it works with colemak-dh
n = up    #k
u = right #l

[num]
a = 1
s = 2
d = 3
f = 4
g = 5
h = 6
j = 7
k = 8
l = 9
; = 0
q = `
u = backspace
i = -
o = =
r = \
w = [
e = ]
t = delete
x = C-S-x
v = C-S-v

